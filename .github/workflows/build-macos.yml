name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.7)'
        required: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Download core.bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download model-v1 --repo RedactProof/accelerator-releases --pattern "core.bin" --output core.bin

      - name: Download Node.js arm64
        run: |
          NODE_VERSION=22.11.0
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o node.tar.gz
          tar -xzf node.tar.gz
          echo "NODE_BIN=$(pwd)/node-v${NODE_VERSION}-darwin-arm64/bin/node" >> $GITHUB_ENV

      - name: Stage payload
        run: |
          mkdir -p payload
          cp "$NODE_BIN" payload/node
          cp server.mjs payload/
          cp core.bin payload/
          cp package.json payload/
          cp -r tokenizer payload/

      - name: npm install
        working-directory: payload
        run: npm install --omit=dev --no-audit --no-fund

      - name: Prune cross-platform binaries
        run: |
          find payload/node_modules -type d -name 'onnxruntime-node' | while read dir; do
            for napi in napi-v3 napi-v6; do
              napi_dir="$dir/bin/$napi"
              [ -d "$napi_dir" ] || continue
              find "$napi_dir" -mindepth 1 -maxdepth 1 -type d ! -name 'darwin' -exec rm -rf {} +
            done
          done
          XENOVA_DIST="payload/node_modules/@xenova/transformers/dist"
          if [ -d "$XENOVA_DIST" ]; then
            find "$XENOVA_DIST" -name '*.wasm' -delete
            find "$XENOVA_DIST" -name '*.map' -delete
          fi
          find payload/node_modules -type d -name 'onnxruntime-web' | while read dir; do
            rm -rf "$dir" && mkdir -p "$dir"
            printf '{"name":"onnxruntime-web","version":"0.0.0-stub","main":"index.js"}' > "$dir/package.json"
            printf 'module.exports={InferenceSession:{},Tensor:function(){},env:{wasm:{}}};module.exports.default=module.exports;' > "$dir/index.js"
          done
          find payload/node_modules -type d -name 'sharp' | while read dir; do
            rm -rf "$dir" && mkdir -p "$dir"
            printf '{"name":"sharp","version":"0.0.0-stub","main":"index.js"}' > "$dir/package.json"
            printf 'module.exports=function(){throw new Error("sharp stub");};module.exports.default=module.exports;' > "$dir/index.js"
          done
          find payload/node_modules -type d -name '@img' -exec rm -rf {} + 2>/dev/null || true
          # Strip non-darwin-arm64 prebuilds from all packages (bare-fs, bare-os, bare-url, etc.)
          find payload/node_modules -name 'prebuilds' -type d | while IFS= read -r prebuild_dir; do
            find "$prebuild_dir" -mindepth 1 -maxdepth 1 -type d | while IFS= read -r sub; do
              if [ "$(basename "$sub")" != "darwin-arm64" ]; then rm -rf "$sub"; echo "pruned: $sub"; fi
            done
          done

      - name: Build .app bundle
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          APP="RedactProofAccelerator.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp payload/node              "$APP/Contents/Resources/node"
          cp payload/server.mjs        "$APP/Contents/Resources/server.mjs"
          cp payload/core.bin          "$APP/Contents/Resources/core.bin"
          cp -r payload/tokenizer      "$APP/Contents/Resources/tokenizer"
          cp -r payload/node_modules   "$APP/Contents/Resources/node_modules"

          # Belt-and-suspenders: prune non-darwin-arm64 prebuilds from app bundle
          find "$APP/Contents/Resources/node_modules" -name 'prebuilds' -type d | while IFS= read -r prebuild_dir; do
            find "$prebuild_dir" -mindepth 1 -maxdepth 1 -type d | while IFS= read -r sub; do
              if [ "$(basename "$sub")" != "darwin-arm64" ]; then rm -rf "$sub"; echo "pruned from bundle: $sub"; fi
            done
          done

          cp installer/macos/launcher.sh "$APP/Contents/MacOS/RedactProofAccelerator"
          chmod +x "$APP/Contents/MacOS/RedactProofAccelerator"

          sed "s/APP_VERSION/$VERSION/g" installer/macos/Info.plist > "$APP/Contents/Info.plist"

      - name: Import signing certificate
        env:
          DEVELOPER_ID_KEY: ${{ secrets.DEVELOPER_ID_KEY }}
          DEVELOPER_ID_CERT: ${{ secrets.DEVELOPER_ID_CERT }}
        run: |
          # Write PEMs from secrets
          printf '%s' "$DEVELOPER_ID_KEY"  > /tmp/dev_id.key
          printf '%s' "$DEVELOPER_ID_CERT" > /tmp/dev_id.crt

          # Create .p12 on macOS using LibreSSL with a throwaway password
          TEMP_PASS=$(openssl rand -hex 16)
          openssl pkcs12 -export \
            -inkey /tmp/dev_id.key \
            -in    /tmp/dev_id.crt \
            -out   /tmp/developer_id.p12 \
            -passout pass:"$TEMP_PASS"

          # Install Apple Developer ID intermediate so chain is complete
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o /tmp/DeveloperIDG2CA.cer
          security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/DeveloperIDG2CA.cer 2>/dev/null || true

          # Import into a fresh keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/developer_id.p12 -k build.keychain -P "$TEMP_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          rm /tmp/dev_id.key /tmp/dev_id.crt /tmp/developer_id.p12

      - name: Sign .app
        run: |
          SIGN_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk '{print $2}')
          # Sign all Mach-O binaries inside the bundle (.node, .dylib, .bare, etc.)
          find "RedactProofAccelerator.app" \( -name "*.node" -o -name "*.dylib" -o -name "*.so" -o -name "*.bare" \) | while read f; do
            codesign --force --sign "$SIGN_ID" --options runtime --timestamp "$f" 2>/dev/null || true
          done
          # Sign the node binary with entitlements
          codesign --force --sign "$SIGN_ID" --options runtime --timestamp \
            --entitlements installer/macos/entitlements.plist \
            "RedactProofAccelerator.app/Contents/Resources/node"
          # Sign the bundle last
          codesign --force --sign "$SIGN_ID" --options runtime --timestamp \
            --entitlements installer/macos/entitlements.plist \
            "RedactProofAccelerator.app"
          codesign --verify --deep --strict "RedactProofAccelerator.app"

      - name: Create and sign .dmg
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          SIGN_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk '{print $2}')
          DMG="RedactProof-Accelerator-arm64-${VERSION}.dmg"
          mkdir -p dmg_staging
          cp -R RedactProofAccelerator.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "RedactProof Accelerator" -srcfolder dmg_staging -ov -format UDZO "$DMG"
          codesign --sign "$SIGN_ID" --timestamp "$DMG"
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > /tmp/api.p8
          SUBMIT=$(xcrun notarytool submit "$DMG" \
            --key /tmp/api.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER_ID" \
            --wait --output-format json)
          echo "$SUBMIT"
          SUBMISSION_ID=$(echo "$SUBMIT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          STATUS=$(echo "$SUBMIT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          # Always fetch the full log so failures are diagnosable
          xcrun notarytool log "$SUBMISSION_ID" \
            --key /tmp/api.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER_ID" 2>&1 || true
          rm /tmp/api.p8
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS"
            exit 1
          fi
          xcrun stapler staple "$DMG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          NOTES=$(printf 'macOS Apple Silicon installer for RedactProof Accelerator v%s.\n\nDrag RedactProofAccelerator to Applications, then open it once. Runs silently in the background and starts automatically at login.\n\nSHA-256: `%s`' "$VERSION" "$SHA")
          gh release create "accelerator-macos-v${VERSION}" "$DMG" \
            --repo RedactProof/accelerator-releases \
            --title "Accelerator macOS v${VERSION}" \
            --notes "$NOTES"
